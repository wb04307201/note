<text x="480" y="948" text-anchor="middle" font-size="13" fill="#455a64">顺时针：A → B → C → D → E → F → G → H → A 闭环 ｜ H 评估变更后触发新一轮循环（橙色虚线经预备阶段）</text>
<text x="480" y="972" text-anchor="middle" font-size="13" fill="#455a64">三层迭代：阶段内（基线 ⇄ 目标两遍扫）｜ 阶段间（同色分组互回：能力 / 定义 / 过渡规划 / 治理）｜ 跨周期（H → 新一轮）</text>
<text x="480" y="996" text-anchor="middle" font-size="13" fill="#455a64">需求管理（环心）与所有阶段双向交互 ｜ TOGAF 10 支持从任意阶段切入并按需裁剪</text>
